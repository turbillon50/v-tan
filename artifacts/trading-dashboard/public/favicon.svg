  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <text x="2"  y="46" fill="white"       fill-opacity="0.9"  font-weight="200" font-size="36" font-family="system-ui,sans-serif" letter-spacing="-1">M</text>
  <text x="19" y="46" fill="url(#two)"                       font-weight="300" font-size="36" font-family="system-ui,sans-serif" filter="url(#g)">2</text>
  <text x="35" y="46" fill="white"       fill-opacity="0.9"  font-weight="200" font-size="36" font-family="system-ui,sans-serif" letter-spacing="-1">M</text>
</svg>
